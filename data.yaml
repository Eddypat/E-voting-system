# =============================================================================
# data.yaml
# CEAP E-Voting System — Voter and Candidate Upload File
# -----------------------------------------------------------------------------
# An electoral officer edits THIS file to register voters and candidates for
# a new election — no Python or SQL knowledge required. Save the file, then
# run:
#       python load_data.py
# to load its contents into the database (see Section 4.2.2 / Appendix C).
#
# Rules:
#   - matric_no must be unique for every student.
#   - Each candidate's "position" must exactly match across all candidates
#     contesting the same seat (e.g. always "President", not "president").
#   - Indentation matters in YAML: keep two spaces per level, as shown below.
# =============================================================================

